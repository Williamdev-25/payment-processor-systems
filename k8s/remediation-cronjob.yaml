# =============================================================================
# RBAC — least-privilege permissions for the remediation bot
# =============================================================================
# get/list/delete on pods only, scoped to this namespace. No cluster-admin,
# no Secrets access, no other namespace. This file is the concrete answer
# to "how do you scope an automation tool's blast radius."
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-bot-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-bot-binding
subjects:
  - kind: ServiceAccount
    name: remediation-bot
roleRef:
  kind: Role
  name: remediation-bot-role
  apiGroup: rbac.authorization.k8s.io
---
# =============================================================================
# CronJob — runs the remediation check on a schedule
# =============================================================================
# A CronJob, not a long-running Deployment: the check is cheap and
# stateless, and this also limits blast radius -- a bug in the bot's own
# image means one failed job run every 5 minutes, not an indefinitely
# crash-looping long-lived pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: remediation-bot
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: remediation-bot
        spec:
          serviceAccountName: remediation-bot
          restartPolicy: Never
          containers:
            - name: remediation-bot
              image: remediation-bot:latest # replace with your ECR image
              args:
                - "--interval=0" # run once and exit; the CronJob schedule handles recurrence
                - "--namespace=default"
                - "--label-selector=app=txn-gateway"
                - "--no-dry-run" # explicit opt-in to real action; script defaults to dry-run
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
