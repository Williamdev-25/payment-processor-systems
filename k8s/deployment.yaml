apiVersion: apps/v1
kind: Deployment
metadata:
  name: txn-gateway
  labels:
    app: txn-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: txn-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: txn-gateway
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: txn-gateway
      containers:
        - name: txn-gateway
          image: txn-gateway:latest # replace with your ECR image URI
          ports:
            - containerPort: 8080
          env:
            - name: FAILURE_RATE
              value: "0.05"
            - name: SLOW_RATE
              value: "0.03"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: txn-gateway-pdb
spec:
  minAvailable: 2 # protects availability during node drains / cluster upgrades
  selector:
    matchLabels:
      app: txn-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: txn-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: txn-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
